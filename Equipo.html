<!DOCTYPE html>
<html lang="es">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0b3d91">
  <title><?= datos.nombreEquipo ?> · Torneo Comercial 2026</title>

  <style>
    :root {
      --azul: #0b3d91;
      --azul-oscuro: #082c6b;
      --gris-claro: #f4f6f9;
      --gris: #6c757d;
      --sombra: 0 4px 12px rgba(0,0,0,0.08);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--gris-claro);
      color: #222;
      line-height: 1.45;
      min-height: 100vh;
    }

    .cover {
      background: linear-gradient(135deg, var(--azul), var(--azul-oscuro));
      color: white;
      padding: 18px 16px 16px;
      text-align: center;
      position: relative;
    }

    .btn-back {
      position: absolute;
      left: 12px;
      top: 18px;
      background: rgba(255,255,255,0.18);
      color: white;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      font-size: 1.2rem;
    }

    .cover h1 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .cover p {
      font-size: 0.88rem;
      opacity: 0.9;
    }

    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #e5e7eb;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .tab-btn {
      flex: 1;
      padding: 13px 4px;
      border: none;
      background: none;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gris);
      text-decoration: none;
      text-align: center;
      border-bottom: 3px solid transparent;
      font-family: inherit;
    }

    .tab-btn.active {
      color: var(--azul);
      border-bottom-color: var(--azul);
    }

    .content {
      max-width: 800px;
      margin: 0 auto;
      padding: 16px 14px 30px;
    }

    .jugador-card {
      background: white;
      border-radius: 12px;
      padding: 13px 15px;
      margin-bottom: 8px;
      box-shadow: var(--sombra);
    }

    .jugador-nombre {
      font-weight: 600;
      font-size: 0.98rem;
      margin-bottom: 6px;
    }

    .jugador-stats {
      display: flex;
      gap: 14px;
      font-size: 0.82rem;
      color: var(--gris);
    }

    .jugador-stats span {
      background: #f0f4f8;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 500;
    }

    .jugador-stats strong {
      color: var(--azul);
    }

    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--gris);
      background: white;
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <div class="cover">
    <a href="<?= ScriptApp.getService().getUrl() ?>" class="btn-back">←</a>
    <h1><?= datos.nombreEquipo ?></h1>
    <p><?= datos.cantidad ?> jugadores</p>
  </div>

  <div class="tabs">
    <a class="tab-btn" href="<?= ScriptApp.getService().getUrl() ?>">Inicio</a>
    <a class="tab-btn" href="<?= ScriptApp.getService().getUrl() ?>">Partidos</a>
    <a class="tab-btn active" href="<?= ScriptApp.getService().getUrl() ?>">Equipos</a>
    <a class="tab-btn" href="<?= ScriptApp.getService().getUrl() ?>">Goleadores</a>
  </div>

  <main class="content">
    <? if (datos.jugadores.length === 0) { ?>
      <div class="empty">No hay jugadores en este equipo.</div>
    <? } else { ?>
      <? for (var i = 0; i < datos.jugadores.length; i++) { ?>
        <div class="jugador-card">
          <div class="jugador-nombre">
            <?= datos.jugadores[i].apellido ?>, <?= datos.jugadores[i].nombre ?>
          </div>
          <div class="jugador-stats">
            <span>PJ <strong><?= datos.jugadores[i].pj ?></strong></span>
            <span>PR <strong><?= datos.jugadores[i].puntos ?></strong></span>
            <span>3P <strong><?= datos.jugadores[i].triples ?></strong></span>
          </div>
        </div>
      <? } ?>
    <? } ?>
  </main>

</body>
</html>
